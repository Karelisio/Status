name: Release

# Push a tag vX.Y.Z → signed APK + GitHub Release with changelog.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Where releases are published and where the app looks for updates.
      # Defaults to this repository; set the RELEASES_REPO variable (+ RELEASES_TOKEN secret)
      # to publish into a separate public repository instead.
      RELEASES_REPO: ${{ vars.RELEASES_REPO != '' && vars.RELEASES_REPO || github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v manquant"; exit 1; fi
          done

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify signature and rename
        id: apk
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK" | tee signature.txt
          if grep -q "CN=Android Debug" signature.txt; then echo "::error::APK signé avec la clé debug"; exit 1; fi
          OUT="Status-${GITHUB_REF_NAME}.apk"
          cp "$APK" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## Nouveautés"
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty="- %s" "$PREV..$GITHUB_REF_NAME"
            else
              git log --no-merges --pretty="- %s" "$GITHUB_REF_NAME"
            fi
            echo
            echo "versionCode ${{ github.run_number }}"
          } > CHANGELOG.md
          cat CHANGELOG.md

      - name: Release (this repository)
        if: env.RELEASES_REPO == github.repository
        uses: softprops/action-gh-release@v2
        with:
          name: Status ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: ${{ steps.apk.outputs.file }}
          make_latest: true

      - name: Release (public releases repository)
        if: env.RELEASES_REPO != github.repository
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Status ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: ${{ steps.apk.outputs.file }}
          make_latest: true
