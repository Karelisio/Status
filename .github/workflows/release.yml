name: Release

# Bump the VERSION file and push to main → tag vX.Y.Z, signed APK and GitHub Release.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Where releases are published and where the app looks for updates.
      # Defaults to this repository; set the RELEASES_REPO variable (+ RELEASES_TOKEN secret)
      # to publish into a separate public repository instead.
      RELEASES_REPO: ${{ vars.RELEASES_REPO != '' && vars.RELEASES_REPO || github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: version
        run: |
          VERSION=$(tr -d ' \n\r' < VERSION)
          VERSION=${VERSION#v}
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION doit être au format X.Y.Z (lu : '$VERSION')"; exit 1
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags "https://github.com/${RELEASES_REPO}.git" "refs/tags/$TAG" >/dev/null 2>&1 \
             || git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG existe déjà, rien à publier. Incrémentez VERSION."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check signing secrets
        if: steps.version.outputs.exists == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v manquant"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - uses: actions/setup-java@v4
        if: steps.version.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        if: steps.version.outputs.exists == 'false'
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.exists == 'false'

      - name: Build signed release APK
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify signature and rename
        if: steps.version.outputs.exists == 'false'
        id: apk
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK" | tee signature.txt
          if grep -q "CN=Android Debug" signature.txt; then echo "::error::APK signé avec la clé debug"; exit 1; fi
          OUT="Status-${{ steps.version.outputs.tag }}.apk"
          cp "$APK" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Changelog
        if: steps.version.outputs.exists == 'false'
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          {
            echo "## Nouveautés"
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty="- %s" "$PREV..HEAD"
            else
              git log --no-merges --pretty="- %s" HEAD
            fi
            echo
            echo "versionCode ${{ github.run_number }}"
          } > CHANGELOG.md
          cat CHANGELOG.md

      - name: Release (this repository)
        if: steps.version.outputs.exists == 'false' && env.RELEASES_REPO == github.repository
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Status ${{ steps.version.outputs.tag }}
          body_path: CHANGELOG.md
          files: ${{ steps.apk.outputs.file }}
          make_latest: true

      - name: Release (public releases repository)
        if: steps.version.outputs.exists == 'false' && env.RELEASES_REPO != github.repository
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: Status ${{ steps.version.outputs.tag }}
          body_path: CHANGELOG.md
          files: ${{ steps.apk.outputs.file }}
          make_latest: true
